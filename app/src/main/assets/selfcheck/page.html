<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mika セルフチェックページ</title>
<style>
  body { font-family: sans-serif; margin: 24px; color: #111; background: #fff; }
  button { font-size: 18px; padding: 12px 20px; }
  p { font-size: 16px; }
</style>
</head>
<body>
<h1>Mika セルフチェックページ</h1>
<p id="marker">これは Mika 自身のローカルテストページです。SELFCHECK-READ-OK</p>
<button id="selfcheck-button" type="button" onclick="clicked()">タップしてください</button>
<p id="status">クリック 0</p>
<script>
  var clicks = 0;
  function clicked() {
    clicks++;
    document.getElementById('status').textContent = 'クリック ' + clicks;
  }
</script>
</body>
</html>
