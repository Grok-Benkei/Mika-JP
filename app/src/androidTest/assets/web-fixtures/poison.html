<!doctype html>
<html>
<head><meta charset="utf-8"><title>poison</title>
<script>
  // ページが一般的なグローバルAPIを先に書き換える。文書の開始時に注入するスクリプトは影響を受けないことを確認する。
  Object.defineProperty = function (o) { return o; };
  Object.getOwnPropertyDescriptor = function () { return undefined; };
  Reflect.apply = function () { return 'poisoned'; };
  JSON.stringify = function () { return '"poisoned"'; };
  String.prototype.toLowerCase = function () { return 'poisoned'; };
  Array.prototype.push = function () { return 0; };
  RegExp.prototype.test = function () { return false; };

</script>
</head>
<body>
