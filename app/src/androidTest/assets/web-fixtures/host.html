<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>host</title>
<style>
  html, body { margin: 0; height: 100%; background: #ff0000; }
  #btn { position: absolute; left: 20%; top: 40%; width: 60%; height: 15%; font-size: 24px; }
</style>
</head>
<body>
<button id="btn">tap me</button>
<script>
  // テストでは次の値を読む: タイマーとアニメーションフレームの回数、および直近のクリックが信頼できるイベントかどうか。
  window.ticks = 0;
  window.frames = 0;
  window.clickTrusted = null;
  setInterval(function () { window.ticks++; }, 100);
  (function loop() { window.frames++; requestAnimationFrame(loop); })();
  document.getElementById('btn').addEventListener('click', function (e) { window.clickTrusted = e.isTrusted; });
</script>
</body>
</html>
