<!doctype html>
<html>
<head><meta charset="utf-8"><title>perm</title></head>
<body>
<script>
  // ページが位置情報とカメラの許可を要求する。どちらもダイアログを出さずに拒否する。
  window.geo = 'pending';
  window.cam = 'pending';
  try {
    navigator.geolocation.getCurrentPosition(function () { window.geo = 'granted'; }, function () { window.geo = 'denied'; });
  } catch (e) { window.geo = 'denied'; }
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(function () { window.cam = 'granted'; }, function (e) { window.cam = e.name; });
  } else {
    window.cam = 'unavailable';
  }
</script>
</body>
</html>
