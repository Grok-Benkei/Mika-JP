name: 端末の互換性を報告
description: Mika JPの互換性チェック結果と、端末での動作状況を報告します
title: "[互換性] "
body:
  - type: markdown
    attributes:
      value: |
        Mika JPの **設定 › 復旧と修復 › 互換性チェック** でチェックを開始してください。約1分で完了します。結果画面の「GitHubで報告」からこのページを開き、コピーした結果を下の「チェック結果」に貼り付けてください。
        報告には端末の機種、OSのバージョン、各チェックの結果が含まれます。アカウントや会話内容は含みません。送信前に内容を確認してください。
  - type: input
    id: model
    attributes:
      label: 端末の機種
      description: メーカー名と機種名
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Androidと端末ソフトウェアのバージョン
      description: Androidのバージョンと、One UIなど端末独自のソフトウェアのバージョン
    validations:
      required: true
  - type: input
    id: mika-version
    attributes:
      label: Mika JPのバージョン
      description: 「設定 › Mika JPについて」で確認できます
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: チェック結果
      description: 互換性チェックの結果全文を貼り付けてください
      render: text
    validations:
      required: true
  - type: dropdown
    id: pairing
    attributes:
      label: スマホ操作の接続は成功しましたか？
      options:
        - 成功した
        - 成功しなかった
        - PCからUSBで起動した
        - 試していない
    validations:
      required: true
  - type: dropdown
    id: tasks
    attributes:
      label: 端末のアプリを操作するタスクは実行できましたか？
      options:
        - 実行できた
        - 一部実行できた
        - 実行できなかった
        - 試していない
    validations:
      required: true
  - type: checkboxes
    id: failed
    attributes:
      label: 成功しなかった項目
      description: 失敗または一部成功の項目を選んでください。すべて成功した場合は選択不要です
      options:
        - label: 端末
        - label: 権限
        - label: スマホ操作ヘルパー
        - label: 仮想画面
        - label: アプリの起動
        - label: 画面の読み取り
        - label: タップと文字入力
        - label: 継続動作
        - label: メイン画面への影響
        - label: 内蔵ブラウザ
        - label: ファイル処理の実行環境
        - label: アプリの複製と仕事用プロファイル
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 表示された内容と、問題が起きたときのタスクを記載してください。アカウント、パスワード、個人の内容は貼り付けないでください
