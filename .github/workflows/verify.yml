name: 検証

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 上流の更新検知・差分取得ツール
        run: python3 -m unittest discover -s tools/upstream -p 'test_*.py' -v
  android-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: 配布ソース作成ツール
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: JVM・CLI・Android本体と画面テストのビルド
        run: bash ./gradlew --no-daemon --console=plain --max-workers=4 --continue :core:test :app:testDebugUnitTest :core:cliTest -PmikaPython=python3 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: 検査結果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            core/build/test-results/
            app/build/test-results/
          retention-days: 7
