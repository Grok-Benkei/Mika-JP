name: 検証

on:
  pull_request:
  push:
    branches: [main, fix/deepseek-flash-reliability, security/harden-android-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 上流の更新検知・差分取得ツール
        run: python3 -m unittest discover -s tools/upstream -p 'test_*.py' -v
  android-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: 配布ソース作成ツール
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: JVM・CLI・Android本体と画面テスト、debug と非デバッグ release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MIKA_RELEASE_KEYSTORE_BASE64: ${{ secrets.MIKA_RELEASE_KEYSTORE_BASE64 }}
          MIKA_RELEASE_STORE_PASSWORD: ${{ secrets.MIKA_RELEASE_STORE_PASSWORD }}
          MIKA_RELEASE_KEY_ALIAS: ${{ secrets.MIKA_RELEASE_KEY_ALIAS }}
          MIKA_RELEASE_KEY_PASSWORD: ${{ secrets.MIKA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keydir="$(mktemp -d)"
          cleanup() { rm -rf "$keydir"; }
          trap cleanup EXIT
          b64="${MIKA_RELEASE_KEYSTORE_BASE64:-${ANDROID_KEYSTORE_BASE64:-}}"
          store_pass="${MIKA_RELEASE_STORE_PASSWORD:-${KEYSTORE_PASSWORD:-}}"
          alias="${MIKA_RELEASE_KEY_ALIAS:-${KEY_ALIAS:-}}"
          key_pass="${MIKA_RELEASE_KEY_PASSWORD:-${KEY_PASSWORD:-}}"
          if [ -n "$b64" ] && [ -n "$store_pass" ] && [ -n "$alias" ] && [ -n "$key_pass" ]; then
            printf '%s' "$b64" | base64 -d > "$keydir/release.keystore"
            export MIKA_RELEASE_KEYSTORE="$keydir/release.keystore"
            export MIKA_RELEASE_STORE_PASSWORD="$store_pass"
            export MIKA_RELEASE_KEY_ALIAS="$alias"
            export MIKA_RELEASE_KEY_PASSWORD="$key_pass"
            echo "release signing: GitHub Actions secret keystore (file is deleted after the build)"
            signing=project-keystore
          else
            unset MIKA_RELEASE_KEYSTORE MIKA_RELEASE_STORE_PASSWORD MIKA_RELEASE_KEY_ALIAS MIKA_RELEASE_KEY_PASSWORD || true
            echo "release signing: secrets absent. The release APK is unsigned and is NOT for personal or distribution use."
            signing=unsigned-not-for-distribution
          fi
          # debug と release を同じ Gradle 起動に混ぜない。splits はタスク名に release があると debug も ABI 分割する。
          bash ./gradlew --no-daemon --console=plain --max-workers=4 --continue :core:test :app:testDebugUnitTest :core:cliTest -PmikaPython=python3 :app:assembleDebug :app:assembleDebugAndroidTest
          bash ./gradlew --no-daemon --console=plain --max-workers=4 :app:assembleRelease
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          info="app/build/outputs/security"
          mkdir -p "$info"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "signing=$signing"
            echo "package=jp.studioyebisu.mika"
          } > "$info/build-info.txt"
          : > "$info/SHA256SUMS"
          shopt -s nullglob
          fail=0
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            sha256sum "$apk" | tee -a "$info/SHA256SUMS"
          done
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            found=1
            echo "---- $(basename "$apk") ----" | tee -a "$info/build-info.txt"
            "$AAPT" dump badging "$apk" > "$info/$(basename "$apk").badging"
            if grep -q "application-debuggable" "$info/$(basename "$apk").badging"; then
              echo "FAIL android:debuggable is set on $apk" | tee -a "$info/build-info.txt"
              fail=1
            else
              echo "OK android:debuggable=false $apk" | tee -a "$info/build-info.txt"
            fi
            if "$APKSIGNER" verify --print-certs "$apk" > "$info/$(basename "$apk").certs" 2> "$info/$(basename "$apk").signerr"; then
              echo "apksigner: signed $apk" | tee -a "$info/build-info.txt"
              grep -E "SHA-256|Signer" "$info/$(basename "$apk").certs" | tee -a "$info/build-info.txt" || true
            else
              echo "apksigner: UNSIGNED $apk — not a distribution build" | tee -a "$info/build-info.txt"
              cat "$info/$(basename "$apk").signerr" >> "$info/build-info.txt" || true
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "FAIL no release APK" | tee -a "$info/build-info.txt"
            fail=1
          fi
          echo "SHA256SUMS:"
          cat "$info/SHA256SUMS"
          if [ -n "${MIKA_RELEASE_KEYSTORE:-}" ]; then
            find app/build -name '*.keystore' -o -name '*.jks' | tee "$info/keystore-leak-check.txt" || true
            if [ -s "$info/keystore-leak-check.txt" ]; then
              echo "FAIL keystore appeared under app/build"
              fail=1
            fi
          fi
          exit "$fail"
      - name: 検査結果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            core/build/test-results/
            app/build/test-results/
            app/build/outputs/security/
          retention-days: 7
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mika-JP-DeepSeekFlash-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload non-debuggable Release APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mika-JP-Release-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/security/
          if-no-files-found: error
          retention-days: 14
