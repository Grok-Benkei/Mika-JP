name: 上流の更新確認

on:
  schedule:
    - cron: '17 0 * * *' # 日本時間の毎日09:17。GitHubの状況により遅れる場合があります。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'yebisu0529-ship-it/Mika-JP'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: 更新を確認し、変化がある場合だけ監査待ちIssueを更新
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/upstream/guard.py watch --publish-issue --output-dir build/upstream-watch
      - name: 実行結果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-watch
          path: build/upstream-watch/
          retention-days: 14
          if-no-files-found: ignore
