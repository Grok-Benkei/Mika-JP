name: カプセル表示レイヤー修正
on:
  push:
    branches: [fix/capsule-overlay-layer]
permissions:
  contents: write
concurrency:
  group: capsule-layer-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: 修正を作成
        run: |
          python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: 単体テストとAndroidビルド
        run: bash ./gradlew --no-daemon --console=plain --max-workers=4 :app:testDebugUnitTest :app:assembleDebug
      - name: テスト成功時だけ修正ブランチを更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs/capsule-overlay-compatibility.md
          git diff --cached --check
          git commit -m "fix: lower capsule overlays with optional application overlay permission"
          git push origin HEAD:fix/capsule-overlay-layer
